<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Clientes | Thab's Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
  <style>
    :root{--cream:#f7f3ec;--white:#fffdf9;--ink:#292824;--muted:#77746d;--sage:#aeb8a2;--sage-light:#e7eadf;--sage-dark:#76806d;--rose-light:#eee1dc;--line:rgba(41,40,36,.10);--shadow:0 18px 45px rgba(41,40,36,.06)}
    *{box-sizing:border-box} body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",sans-serif} button,input,textarea{font:inherit} button{cursor:pointer}
    .app{min-height:100vh;display:grid;grid-template-columns:245px minmax(0,1fr)}
    .sidebar{min-height:100vh;position:sticky;top:0;height:100vh;padding:34px 24px 26px;background:var(--ink);color:var(--white);display:flex;flex-direction:column}
    .brand{padding:0 12px 38px;font-size:14px;font-weight:600;letter-spacing:.17em;text-transform:uppercase}
    .nav{display:flex;flex-direction:column;gap:6px}.nav-item{width:100%;padding:13px 14px;border:0;border-radius:12px;background:transparent;color:rgba(255,255,255,.62);text-align:left;text-decoration:none;display:block;font:inherit;transition:.2s}
    .nav-item:hover,.nav-item.active{background:rgba(255,255,255,.09);color:white}.sidebar-bottom{margin-top:auto;padding-top:25px}.admin-label{padding:0 12px 17px;color:rgba(255,255,255,.45);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
    .logout{width:100%;padding:12px 14px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:transparent;color:rgba(255,255,255,.72);text-align:left}
    .content{min-width:0;padding:44px clamp(25px,4vw,65px) 70px}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:30px;margin-bottom:30px}.eyebrow{margin-bottom:9px;color:var(--sage-dark);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:0;font-family:"Playfair Display",serif;font-size:clamp(36px,4vw,52px);font-weight:500;line-height:1.05}.date{margin-top:10px;color:var(--muted);font-size:14px}
    .primary-button{flex-shrink:0;padding:14px 21px;border:0;border-radius:100px;background:var(--ink);color:white;font-size:13px;font-weight:600;text-decoration:none;display:inline-block}
    .search-wrap{margin-bottom:20px}.search{width:100%;padding:15px 18px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.72);outline:none}.search:focus{border-color:var(--sage)}
    .layout{display:grid;grid-template-columns:minmax(300px,.78fr) minmax(0,1.5fr);gap:20px;align-items:start}
    .panel{border:1px solid var(--line);border-radius:20px;background:var(--white);box-shadow:var(--shadow);overflow:hidden}.panel-header{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
    .panel-title{margin:0;font-family:"Playfair Display",serif;font-size:22px;font-weight:500}.count{color:var(--muted);font-size:11px}
    .client-list{max-height:720px;overflow:auto}.client-row{width:100%;padding:16px 20px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}.client-row:hover,.client-row.active{background:var(--sage-light)}.client-name{font-weight:600}.client-meta{margin-top:4px;color:var(--muted);font-size:11px}
    .empty{padding:34px 22px;color:var(--muted);font-size:13px;line-height:1.7}.profile{padding:25px}.profile-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.profile h2{margin:0;font-family:"Playfair Display",serif;font-size:30px;font-weight:500}.profile-contact{margin-top:6px;color:var(--muted);font-size:12px;line-height:1.6}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.stat{padding:15px;border-radius:14px;background:var(--cream)}.stat-label{color:var(--muted);font-size:10px}.stat-value{margin-top:7px;font-family:"Playfair Display",serif;font-size:22px}
    .section{margin-top:26px}.section-title{margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sage-dark)}
    .next-card{padding:16px;border-radius:14px;background:var(--sage-light);font-size:12px;line-height:1.65}.history{border-top:1px solid var(--line)}.history-row{display:grid;grid-template-columns:95px minmax(0,1fr) auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:11px}.history-service{font-weight:600}.history-status{margin-top:3px;color:var(--muted);font-size:10px}.history-price{font-weight:600}
    .notes{width:100%;min-height:105px;resize:vertical;padding:13px;border:1px solid var(--line);border-radius:12px;background:white;outline:none}.notes:focus{border-color:var(--sage)}.note-actions{display:flex;align-items:center;gap:12px;margin-top:9px}.small-button{padding:9px 13px;border:0;border-radius:100px;background:var(--ink);color:white;font-size:11px;font-weight:600}.save-message{color:var(--muted);font-size:10px}
    .loading-screen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--cream);color:var(--muted);font-size:13px}
    @media(max-width:1000px){.layout{grid-template-columns:1fr}.client-list{max-height:400px}}
    @media(max-width:760px){.app{display:block}.sidebar{position:static;min-height:auto;height:auto;padding:22px}.brand{padding:0 0 20px}.nav{flex-direction:row;overflow-x:auto}.nav-item{width:auto;white-space:nowrap}.sidebar-bottom{display:none}.content{padding:30px 20px 60px}.topbar{flex-direction:column}.stats{grid-template-columns:1fr 1fr}.history-row{grid-template-columns:80px minmax(0,1fr)}.history-price{grid-column:2}}
  </style>
</head>
<body>
<div id="loading-screen" class="loading-screen">Vérification de ton espace…</div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Thab's Lab</div>
    <nav class="nav">
      <a class="nav-item" href="./dashboard.html">Vue d'ensemble</a>
      <a class="nav-item" href="./agenda.html">Agenda</a>
      <a class="nav-item active" href="./clientes.html">Clientes</a>
      <button class="nav-item">Prestations</button>
      <button class="nav-item">Horaires</button>
      <button class="nav-item">Finances</button>
    </nav>
    <div class="sidebar-bottom"><div class="admin-label">Espace administrateur</div><button id="logout" class="logout">Se déconnecter</button></div>
  </aside>

  <main class="content">
    <header class="topbar">
      <div><div class="eyebrow">Clientes</div><h1>Mon fichier clientes</h1><div class="date">Coordonnées, historique et suivi en un seul endroit.</div></div>
      <a class="primary-button" href="./nouveau-rdv.html">+ Nouveau rendez-vous</a>
    </header>

    <div class="search-wrap"><input id="search" class="search" type="search" placeholder="Rechercher par nom, prénom, téléphone ou e-mail…"></div>

    <section class="layout">
      <article class="panel">
        <div class="panel-header"><h2 class="panel-title">Clientes</h2><span id="client-count" class="count">—</span></div>
        <div id="client-list" class="client-list"><div class="empty">Chargement…</div></div>
      </article>

      <article class="panel">
        <div id="profile"><div class="empty">Sélectionne une cliente pour ouvrir sa fiche.</div></div>
      </article>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://zlmwytycgopowalfrjwf.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_oN_GBtiyokchMsnKNLu-1A_Cz_dtDrG";
  const supabaseClient = supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  const TZ="Europe/Brussels";
  const euro=new Intl.NumberFormat("fr-BE",{style:"currency",currency:"EUR"});
  const dateFmt=new Intl.DateTimeFormat("fr-BE",{timeZone:TZ,day:"2-digit",month:"2-digit",year:"numeric"});
  const longDateFmt=new Intl.DateTimeFormat("fr-BE",{timeZone:TZ,weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const timeFmt=new Intl.DateTimeFormat("fr-BE",{timeZone:TZ,hour:"2-digit",minute:"2-digit"});
  let clients=[], selectedClientId=null;

  function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
  function cap(v){return v?v.charAt(0).toUpperCase()+v.slice(1):v}
  function clientName(c){return `${c.first_name||""} ${c.last_name||""}`.trim()||"Cliente"}

  async function protectPage(){
    const {data:{session}}=await supabaseClient.auth.getSession();
    if(!session){window.location.replace("./");return false}
    const {data:isAdmin,error}=await supabaseClient.rpc("is_admin");
    if(error||isAdmin!==true){await supabaseClient.auth.signOut();window.location.replace("./");return false}
    document.getElementById("loading-screen").style.display="none";return true
  }

  async function loadClients(){
    const {data,error}=await supabaseClient.from("clients")
      .select("id,first_name,last_name,email,phone,birth_date,instagram,private_notes,created_at")
      .order("first_name",{ascending:true}).order("last_name",{ascending:true});
    if(error){console.error(error);document.getElementById("client-list").innerHTML='<div class="empty">Impossible de charger les clientes.</div>';return}
    clients=data||[];
    renderClientList();
  }

  function renderClientList(){
    const q=document.getElementById("search").value.trim().toLowerCase();
    const filtered=clients.filter(c=>[c.first_name,c.last_name,c.phone,c.email].filter(Boolean).join(" ").toLowerCase().includes(q));
    document.getElementById("client-count").textContent=`${filtered.length} cliente${filtered.length>1?"s":""}`;
    const box=document.getElementById("client-list");
    if(!filtered.length){box.innerHTML='<div class="empty">Aucune cliente trouvée.</div>';return}
    box.innerHTML=filtered.map(c=>`<button class="client-row ${c.id===selectedClientId?"active":""}" data-client-id="${c.id}">
      <div class="client-name">${escapeHtml(clientName(c))}</div>
      <div class="client-meta">${escapeHtml(c.phone||c.email||"Coordonnées non renseignées")}</div>
    </button>`).join("");
    document.querySelectorAll("[data-client-id]").forEach(el=>el.addEventListener("click",()=>openClient(el.dataset.clientId)));
  }

  async function openClient(id){
    selectedClientId=id; renderClientList();
    const c=clients.find(x=>x.id===id); if(!c)return;
    const profile=document.getElementById("profile");
    profile.innerHTML='<div class="empty">Chargement de la fiche…</div>';

    const [{data:appointments,error:appointmentError},{data:payments,error:paymentError}]=await Promise.all([
      supabaseClient.from("appointments")
        .select("id,starts_at,ends_at,expected_price_cents,status,service_name_snapshot")
        .eq("client_id",id).order("starts_at",{ascending:false}),
      supabaseClient.from("payments")
        .select("amount_cents,payment_type,paid_at,appointments!inner(client_id)")
        .eq("appointments.client_id",id)
    ]);

    if(appointmentError||paymentError){
      console.error(appointmentError||paymentError);
      profile.innerHTML='<div class="empty">Impossible de charger toute la fiche cliente.</div>';return;
    }

    const appts=appointments||[], now=new Date();
    const visits=appts.filter(a=>a.status==="completed").length;
    const next=[...appts].filter(a=>new Date(a.starts_at)>=now&&["pending","confirmed"].includes(a.status))
      .sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at))[0]||null;
    const total=(payments||[]).reduce((sum,p)=>p.payment_type==="refund"?sum-p.amount_cents:sum+p.amount_cents,0);
    const birthday=c.birth_date ? new Date(`${c.birth_date}T12:00:00`) : null;
    const statusLabel={pending:"En attente",confirmed:"Confirmé",completed:"Terminé",cancelled_by_client:"Annulé par la cliente",cancelled_by_admin:"Annulé",late_cancellation:"Annulation tardive",no_show:"Absence"};

    profile.innerHTML=`<div class="profile">
      <div class="profile-head">
        <div>
          <h2>${escapeHtml(clientName(c))}</h2>
          <div class="profile-contact">
            ${c.phone?`📞 ${escapeHtml(c.phone)}<br>`:""}
            ${c.email?`✉ ${escapeHtml(c.email)}<br>`:""}
            ${c.instagram?`Instagram · ${escapeHtml(c.instagram)}<br>`:""}
            ${birthday?`Anniversaire · ${dateFmt.format(birthday)}`:""}
          </div>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><div class="stat-label">Cliente depuis</div><div class="stat-value">${dateFmt.format(new Date(c.created_at))}</div></div>
        <div class="stat"><div class="stat-label">Visites terminées</div><div class="stat-value">${visits}</div></div>
        <div class="stat"><div class="stat-label">Total encaissé</div><div class="stat-value">${euro.format(total/100)}</div></div>
      </div>

      <div class="section">
        <h3 class="section-title">Prochain rendez-vous</h3>
        ${next?`<div class="next-card"><strong>${cap(longDateFmt.format(new Date(next.starts_at)))}</strong> à ${timeFmt.format(new Date(next.starts_at))}<br>${escapeHtml(next.service_name_snapshot)} · ${euro.format((next.expected_price_cents||0)/100)}</div>`:'<div class="next-card">Aucun rendez-vous à venir.</div>'}
      </div>

      <div class="section">
        <h3 class="section-title">Notes privées</h3>
        <textarea id="private-notes" class="notes" placeholder="Préférences, remarques, informations utiles…">${escapeHtml(c.private_notes||"")}</textarea>
        <div class="note-actions"><button id="save-notes" class="small-button" type="button">Enregistrer</button><span id="save-message" class="save-message"></span></div>
      </div>

      <div class="section">
        <h3 class="section-title">Historique</h3>
        <div class="history">
          ${appts.length?appts.map(a=>`<div class="history-row">
            <div>${dateFmt.format(new Date(a.starts_at))}<br>${timeFmt.format(new Date(a.starts_at))}</div>
            <div><div class="history-service">${escapeHtml(a.service_name_snapshot)}</div><div class="history-status">${escapeHtml(statusLabel[a.status]||a.status)}</div></div>
            <div class="history-price">${euro.format((a.expected_price_cents||0)/100)}</div>
          </div>`).join(""):'<div class="empty">Aucun rendez-vous enregistré.</div>'}
        </div>
      </div>
    </div>`;

    document.getElementById("save-notes").addEventListener("click",()=>saveNotes(c));
  }

  async function saveNotes(c){
    const button=document.getElementById("save-notes"), msg=document.getElementById("save-message");
    const value=document.getElementById("private-notes").value.trim();
    button.disabled=true; msg.textContent="Enregistrement…";
    const {error}=await supabaseClient.from("clients").update({private_notes:value||null}).eq("id",c.id);
    button.disabled=false;
    if(error){console.error(error);msg.textContent="Erreur lors de l’enregistrement.";return}
    c.private_notes=value||null; msg.textContent="Enregistré ✓";
  }

  document.getElementById("search").addEventListener("input",renderClientList);
  document.getElementById("logout").addEventListener("click",async()=>{await supabaseClient.auth.signOut();window.location.replace("./")});

  async function init(){if(!await protectPage())return;await loadClients()}
  init();
</script>
</body>
</html>
