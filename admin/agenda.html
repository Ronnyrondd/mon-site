<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Agenda | Thab's Lab</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream:#f7f3ec; --white:#fffdf9; --ink:#292824; --muted:#77746d;
      --sage:#aeb8a2; --sage-light:#e7eadf; --sage-dark:#76806d;
      --rose-light:#eee1dc; --line:rgba(41,40,36,.10);
      --shadow:0 18px 45px rgba(41,40,36,.06);
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--cream); color:var(--ink); font-family:"DM Sans",sans-serif; }
    button { font:inherit; cursor:pointer; }
    .app { min-height:100vh; display:grid; grid-template-columns:245px minmax(0,1fr); }
    .sidebar { min-height:100vh; position:sticky; top:0; height:100vh; padding:34px 24px 26px; background:var(--ink); color:var(--white); display:flex; flex-direction:column; }
    .brand { padding:0 12px 38px; font-size:14px; font-weight:600; letter-spacing:.17em; text-transform:uppercase; }
    .nav { display:flex; flex-direction:column; gap:6px; }
    .nav-item { width:100%; padding:13px 14px; border:0; border-radius:12px; background:transparent; color:rgba(255,255,255,.62); text-align:left; text-decoration:none; display:block; transition:.2s ease; font:inherit; }
    .nav-item:hover,.nav-item.active { background:rgba(255,255,255,.09); color:white; }
    .sidebar-bottom { margin-top:auto; padding-top:25px; }
    .admin-label { padding:0 12px 17px; color:rgba(255,255,255,.45); font-size:11px; letter-spacing:.1em; text-transform:uppercase; }
    .logout { width:100%; padding:12px 14px; border:1px solid rgba(255,255,255,.14); border-radius:12px; background:transparent; color:rgba(255,255,255,.72); text-align:left; }
    .content { min-width:0; padding:44px clamp(25px,4vw,65px) 70px; }
    .topbar { display:flex; align-items:flex-start; justify-content:space-between; gap:30px; margin-bottom:28px; }
    .eyebrow { margin-bottom:9px; color:var(--sage-dark); font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0; font-family:"Playfair Display",serif; font-size:clamp(36px,4vw,52px); font-weight:500; line-height:1.05; }
    .date { margin-top:10px; color:var(--muted); font-size:14px; }
    .primary-button { flex-shrink:0; padding:14px 21px; border:0; border-radius:100px; background:var(--ink); color:white; font-size:13px; font-weight:600; text-decoration:none; display:inline-block; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:18px; flex-wrap:wrap; margin-bottom:20px; }
    .period-nav,.view-switch { display:flex; align-items:center; gap:8px; }
    .tool-button { border:1px solid var(--line); background:rgba(255,255,255,.65); color:var(--ink); border-radius:100px; padding:10px 14px; }
    .arrow { width:40px; height:40px; padding:0; font-size:18px; }
    .period-title { min-width:220px; text-align:center; font-family:"Playfair Display",serif; font-size:22px; }
    .view-switch { padding:4px; border:1px solid var(--line); border-radius:100px; background:rgba(255,255,255,.55); }
    .view-button { border:0; background:transparent; color:var(--muted); padding:8px 14px; border-radius:100px; }
    .view-button.active { background:var(--ink); color:white; }
    .calendar-card { border:1px solid var(--line); border-radius:20px; background:var(--white); box-shadow:var(--shadow); overflow:hidden; }
    .week-grid { display:grid; grid-template-columns:repeat(7,minmax(125px,1fr)); min-width:900px; }
    .day-column { min-height:580px; border-right:1px solid var(--line); }
    .day-column:last-child { border-right:0; }
    .day-head { padding:16px 14px; border-bottom:1px solid var(--line); text-align:center; position:sticky; top:0; background:var(--white); z-index:2; }
    .day-name { color:var(--muted); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; }
    .day-number { margin-top:5px; font-family:"Playfair Display",serif; font-size:26px; }
    .day-column.today .day-number { display:inline-flex; width:38px; height:38px; align-items:center; justify-content:center; border-radius:50%; background:var(--ink); color:white; }
    .day-body { padding:12px; display:grid; gap:9px; align-content:start; }
    .appointment { padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--sage-light); cursor:pointer; }
    .appointment.pending { background:var(--rose-light); }
    .appointment.completed { background:#f0efe9; opacity:.75; }
    .appointment.no_show { background:#f3ece8; opacity:.72; border-style:dashed; }
    .appointment-time { font-size:12px; font-weight:600; }
    .appointment-client { margin-top:5px; font-size:12px; font-weight:600; }
    .appointment-service { margin-top:2px; color:var(--muted); font-size:10px; line-height:1.35; }
    .appointment-price { margin-top:7px; font-size:10px; font-weight:600; }
    .empty-day { padding:14px 4px; color:#aaa69e; font-size:10px; text-align:center; }

    /* VUE SEMAINE — PLANNING HORAIRE */
    .timeline-week { min-width:1050px; }
    .timeline-head {
      display:grid;
      grid-template-columns:64px repeat(7,minmax(135px,1fr));
      border-bottom:1px solid var(--line);
      background:var(--white);
      position:sticky;
      top:0;
      z-index:10;
    }
    .timeline-head-spacer { border-right:1px solid var(--line); }
    .timeline-day-head {
      padding:14px 10px;
      text-align:center;
      border-right:1px solid var(--line);
    }
    .timeline-day-head:last-child { border-right:0; }
    .timeline-day-head .day-name {
      color:var(--muted);
      font-size:10px;
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:.08em;
    }
    .timeline-day-head .day-number {
      margin-top:4px;
      font-family:"Playfair Display",serif;
      font-size:24px;
    }
    .timeline-day-head.today .day-number {
      margin:4px auto 0;
      display:flex;
      width:36px;
      height:36px;
      align-items:center;
      justify-content:center;
      border-radius:50%;
      background:var(--ink);
      color:white;
    }
    .timeline-body {
      display:grid;
      grid-template-columns:64px repeat(7,minmax(135px,1fr));
      position:relative;
    }
    .time-axis {
      position:relative;
      border-right:1px solid var(--line);
      background:rgba(247,243,236,.38);
    }
    .time-label {
      position:absolute;
      right:10px;
      transform:translateY(-7px);
      color:var(--muted);
      font-size:9px;
    }
    .timeline-day {
      position:relative;
      border-right:1px solid var(--line);
      background-image:linear-gradient(to bottom, var(--line) 1px, transparent 1px);
      background-size:100% 60px;
    }
    .timeline-day:last-child { border-right:0; }
    .timeline-day.today { background-color:rgba(231,234,223,.24); }
    .timeline-appointment {
      position:absolute;
      left:6px;
      right:6px;
      z-index:3;
      overflow:hidden;
      padding:7px 8px;
      border:1px solid rgba(41,40,36,.08);
      border-radius:10px;
      background:var(--sage-light);
      box-shadow:0 5px 12px rgba(41,40,36,.05);
      cursor:pointer;
    }
    .timeline-appointment.pending { background:var(--rose-light); }
    .timeline-appointment.completed { background:#f0efe9; opacity:.76; }
    .timeline-appointment.no_show { background:#f3ece8; opacity:.72; border-style:dashed; }
    .timeline-appointment .appointment-time { font-size:10px; }
    .timeline-appointment .appointment-client {
      margin-top:2px;
      font-size:10px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .timeline-appointment .appointment-service {
      margin-top:1px;
      font-size:9px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .timeline-appointment.compact .appointment-service,
    .timeline-appointment.compact .appointment-price { display:none; }
    .timeline-appointment.tiny .appointment-client,
    .timeline-appointment.tiny .appointment-service,
    .timeline-appointment.tiny .appointment-price { display:none; }
    .current-time-line {
      position:absolute;
      left:0;
      right:0;
      z-index:5;
      height:1px;
      background:#8b5d5d;
      pointer-events:none;
    }
    .current-time-line::before {
      content:"";
      position:absolute;
      left:-4px;
      top:-3px;
      width:7px;
      height:7px;
      border-radius:50%;
      background:#8b5d5d;
    }

    .month-grid { display:grid; grid-template-columns:repeat(7,minmax(120px,1fr)); min-width:850px; }
    .month-weekday { padding:13px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); color:var(--muted); font-size:11px; font-weight:600; text-align:center; text-transform:uppercase; }
    .month-cell { min-height:125px; padding:10px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); cursor:pointer; }
    .month-cell.other-month { background:rgba(247,243,236,.55); color:#aaa69e; }
    .month-cell.today { box-shadow:inset 0 0 0 2px var(--sage); }
    .month-number { font-family:"Playfair Display",serif; font-size:18px; margin-bottom:8px; }
    .month-event { margin:4px 0; padding:5px 7px; border-radius:7px; background:var(--sage-light); font-size:9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .month-more { margin-top:5px; color:var(--muted); font-size:9px; }
    .calendar-scroll { overflow-x:auto; }
    .loading-screen { position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; background:var(--cream); color:var(--muted); font-size:13px; }
    .error { padding:35px; color:#9b5757; text-align:center; }
    .modal-backdrop { position:fixed; inset:0; z-index:50; background:rgba(41,40,36,.32); display:none; align-items:center; justify-content:center; padding:20px; }
    .modal-backdrop.open { display:flex; }
    .modal { width:min(460px,100%); border-radius:20px; background:var(--white); padding:26px; box-shadow:0 25px 80px rgba(0,0,0,.18); }
    .modal-top { display:flex; justify-content:space-between; gap:20px; }
    .modal h2 { margin:0; font-family:"Playfair Display",serif; font-weight:500; }
    .close { border:0; background:transparent; font-size:22px; }
    .detail { display:flex; justify-content:space-between; gap:20px; padding:12px 0; border-bottom:1px solid var(--line); font-size:12px; }
    .detail span { color:var(--muted); }
    .detail strong { text-align:right; }

    /* ACTIONS RDV */
    .modal { width:min(520px,100%); max-height:90vh; overflow:auto; }
    .modal-actions { display:flex; flex-wrap:wrap; gap:9px; margin-top:22px; }
    .action-button {
      border:1px solid var(--line); border-radius:100px; padding:11px 15px;
      background:var(--white); color:var(--ink); font-size:12px; font-weight:600;
    }
    .action-button.primary { background:var(--ink); color:white; border-color:var(--ink); }
    .action-button.danger { color:#8b5151; border-color:rgba(139,81,81,.25); }
    .action-button:disabled { opacity:.45; cursor:not-allowed; }
    .status-pill {
      display:inline-flex; padding:5px 9px; border-radius:100px;
      background:var(--sage-light); font-size:10px; font-weight:600;
    }
    .status-pill.pending { background:var(--rose-light); }
    .status-pill.completed { background:#efeee8; }
    .status-pill.no_show { background:#f3e8e3; color:#7b5a50; }
    .form-box { margin-top:20px; padding-top:18px; border-top:1px solid var(--line); }
    .form-title { margin:0 0 14px; font-family:"Playfair Display",serif; font-size:20px; font-weight:500; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .form-field { display:flex; flex-direction:column; gap:6px; }
    .form-field.full { grid-column:1/-1; }
    .form-field label { color:var(--muted); font-size:10px; font-weight:600; }
    .form-field input,.form-field select {
      width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px;
      background:white; color:var(--ink); font:inherit; font-size:12px;
    }
    .form-message { min-height:18px; margin-top:10px; color:var(--muted); font-size:11px; }
    .form-message.error-message { color:#9b5757; }
    .form-message.success-message { color:var(--sage-dark); }
    .prep-box{margin-top:20px;padding:18px;border:1px solid var(--line);border-radius:16px;background:rgba(247,243,236,.55)}
    .prep-title{margin:0 0 14px;font-family:"Playfair Display",serif;font-size:20px;font-weight:500}
    .prep-section+.prep-section{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
    .prep-label{margin-bottom:8px;color:var(--sage-dark);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
    .prep-row{display:grid;grid-template-columns:105px 1fr;gap:12px;padding:5px 0;font-size:12px;line-height:1.45}
    .prep-row span,.prep-empty,.prep-loading,.prep-note-message{color:var(--muted)}
    .prep-row strong{font-weight:600;overflow-wrap:anywhere}
    .prep-empty,.prep-loading{font-size:12px;line-height:1.5}
    .prep-note{width:100%;min-height:82px;resize:vertical;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);font:inherit;font-size:12px;line-height:1.45}
    .prep-note-actions{display:flex;align-items:center;gap:10px;margin-top:10px}
    .prep-note-message{font-size:10px}
    .prep-media-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
    .prep-media-card{display:block;aspect-ratio:1/1;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:white}
    .prep-media-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s ease}
    .prep-media-card:hover img{transform:scale(1.02)}
    .prep-media-empty{color:var(--muted);font-size:12px;line-height:1.5}
    /* CROQUIS NAIL ART — éditeur simple sur image */
    .sketch-shell{margin-top:10px}
    .sketch-stage{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#f3eee7;touch-action:none;user-select:none}
    .sketch-stage canvas{width:100%;height:100%;display:block;touch-action:none}
    .sketch-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
    .sketch-toolbar select,.sketch-toolbar input[type="color"]{height:36px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);font:inherit;font-size:11px}
    .sketch-toolbar select{padding:0 9px}
    .sketch-toolbar input[type="color"]{width:42px;padding:3px}
    .sketch-range{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10px}
    .sketch-range input{width:82px}
    .sketch-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
    .sketch-status{font-size:10px;color:var(--muted)}
    .sketch-help{margin-top:8px;color:var(--muted);font-size:10px;line-height:1.45}
    .sketch-upload{display:none}
    .sketch-tool.active{background:var(--ink);color:white;border-color:var(--ink)}
    .sketch-palette{display:none;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.72)}
    .sketch-palette.open{display:block}
    .sketch-palette-title{margin-bottom:8px;color:var(--muted);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
    .sketch-swatches,.sketch-shapes{display:flex;flex-wrap:wrap;gap:8px}
    .sketch-choice{min-width:38px;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);font-size:11px}
    .sketch-choice.active{outline:2px solid var(--sage-dark);outline-offset:1px}
    .sketch-swatch{width:38px;height:38px;padding:0;border:2px solid white;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
    .sketch-swatch.active{box-shadow:0 0 0 2px var(--sage-dark)}
    .sketch-selected-actions{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding:10px;border-radius:12px;background:var(--sage-light)}
    .sketch-selected-actions.open{display:flex}
    .sketch-selected-label{font-size:10px;color:var(--sage-dark);font-weight:600;margin-right:auto}
    .sketch-template-picker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
    .sketch-template-picker .sketch-palette-title{margin:0 4px 0 0}





    .prep-media-card{cursor:zoom-in;padding:0}
    .prep-media-lightbox{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:28px;background:rgba(24,23,21,.82)}
    .prep-media-lightbox.open{display:flex}
    .prep-media-lightbox img{max-width:min(100%,1000px);max-height:88vh;object-fit:contain;border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.28)}
    .prep-media-lightbox-close{position:absolute;top:18px;right:22px;width:42px;height:42px;border:1px solid rgba(255,255,255,.25);border-radius:50%;background:rgba(255,255,255,.10);color:white;font-size:25px;line-height:1}

    @media(max-width:760px) {
      .app{display:block}.sidebar{position:static;min-height:auto;height:auto;padding:22px}.brand{padding:0 0 20px}
      .nav{flex-direction:row;overflow-x:auto}.nav-item{width:auto;white-space:nowrap}.sidebar-bottom{display:none}
      .content{padding:30px 20px 60px}.topbar{flex-direction:column}.period-title{min-width:150px}.toolbar{align-items:flex-start}
    }
  </style>
</head>
<body>
  <div id="loading-screen" class="loading-screen">Vérification de ton espace…</div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">Thab's Lab</div>
      <nav class="nav">
        <a class="nav-item" href="./dashboard.html">Vue d'ensemble</a>
        <a class="nav-item active" href="./agenda.html">Agenda</a>
        <a class="nav-item" href="./clientes.html">Clientes</a>
        <a class="nav-item" href="./prestations.html">Prestations</a>
        <a class="nav-item" href="./horaires.html">Horaires</a>
        <a class="nav-item" href="./finances.html">Finances</a>
      </nav>
      <div class="sidebar-bottom">
        <div class="admin-label">Espace administrateur</div>
        <button id="logout" class="logout">Se déconnecter</button>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <div class="eyebrow">Agenda</div>
          <h1>Mon planning</h1>
          <div class="date">Tes rendez-vous en un coup d'œil.</div>
        </div>
        <a class="primary-button" href="./nouveau-rdv.html">+ Nouveau rendez-vous</a>
      </header>

      <div class="toolbar">
        <div class="period-nav">
          <button id="previous" class="tool-button arrow" type="button">‹</button>
          <button id="today" class="tool-button" type="button">Aujourd'hui</button>
          <button id="next" class="tool-button arrow" type="button">›</button>
          <div id="period-title" class="period-title"></div>
        </div>
        <div class="view-switch">
          <button id="week-view" class="view-button active" type="button">Semaine</button>
          <button id="month-view" class="view-button" type="button">Mois</button>
        </div>
      </div>

      <section class="calendar-card">
        <div class="calendar-scroll">
          <div id="calendar"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="modal-backdrop" class="modal-backdrop">
    <div class="modal">
      <div class="modal-top">
        <h2>Détail du rendez-vous</h2>
        <button id="close-modal" class="close" type="button">×</button>
      </div>
      <div id="modal-content"></div>
    </div>
  </div>


  <div id="prep-media-lightbox" class="prep-media-lightbox" aria-hidden="true">
    <button id="prep-media-lightbox-close" class="prep-media-lightbox-close" type="button" aria-label="Fermer">×</button>
    <img id="prep-media-lightbox-image" alt="Inspiration nail art agrandie">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://zlmwytycgopowalfrjwf.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_oN_GBtiyokchMsnKNLu-1A_Cz_dtDrG";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const TZ = "Europe/Brussels";
    const euro = new Intl.NumberFormat("fr-BE",{style:"currency",currency:"EUR"});
    const dayName = new Intl.DateTimeFormat("fr-BE",{timeZone:TZ,weekday:"short"});
    const fullDate = new Intl.DateTimeFormat("fr-BE",{timeZone:TZ,weekday:"long",day:"numeric",month:"long",year:"numeric"});
    const monthTitle = new Intl.DateTimeFormat("fr-BE",{timeZone:TZ,month:"long",year:"numeric"});
    const timeFormat = new Intl.DateTimeFormat("fr-BE",{timeZone:TZ,hour:"2-digit",minute:"2-digit"});

    let currentDate = new Date();
    let currentView = localStorage.getItem("adminAgendaView") || "week";
    let appointments = [];

    function escapeHtml(value) {
      return String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }
    function capitalize(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
    function localKey(date){
      const p = new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(date);
      const v={}; p.forEach(x=>{if(x.type!=="literal")v[x.type]=x.value});
      return `${v.year}-${v.month}-${v.day}`;
    }
    function dateFromKey(key){ return new Date(`${key}T12:00:00`); }
    function addDays(date,n){ const d=new Date(date); d.setDate(d.getDate()+n); return d; }
    function startOfWeek(date){
      const d = dateFromKey(localKey(date));
      const day = d.getDay();
      d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
      return d;
    }
    function startOfMonth(date){ const d=dateFromKey(localKey(date)); return new Date(d.getFullYear(),d.getMonth(),1,12); }
    function endOfMonth(date){ const d=startOfMonth(date); return new Date(d.getFullYear(),d.getMonth()+1,0,12); }

      if(error || isAdmin !== true){ await supabaseClient.auth.signOut(); window.location.replace("./"); return false; }

    function renderWeek(){
      const start=startOfWeek(currentDate), map=grouped(), todayKey=localKey(new Date());
      const days=Array.from({length:7},(_,i)=>addDays(start,i));

      document.getElementById("period-title").textContent =
        `${days[0].getDate()} ${days[0].toLocaleDateString("fr-BE",{month:"short"})} – ${days[6].getDate()} ${days[6].toLocaleDateString("fr-BE",{month:"short",year:"numeric"})}`;

      /*
        La grille couvre 07:00 → 22:00.
        1 heure = 60 px : la hauteur d'un RDV est donc directement
        proportionnelle à sa vraie durée.
      */
      const startHour=7;
      const endHour=22;
      const pixelsPerMinute=1;
      const totalHeight=(endHour-startHour)*60*pixelsPerMinute;

      function minutesInBrussels(date){
        const parts=new Intl.DateTimeFormat("en-GB",{
          timeZone:TZ,hour:"2-digit",minute:"2-digit",hourCycle:"h23"
        }).formatToParts(date);
        const values={};
        parts.forEach(p=>{if(p.type!=="literal") values[p.type]=p.value;});
        return Number(values.hour)*60+Number(values.minute);
      }

      const hourLabels=Array.from({length:endHour-startHour+1},(_,i)=>startHour+i)
        .map(hour=>`<div class="time-label" style="top:${(hour-startHour)*60}px">${String(hour).padStart(2,"0")}:00</div>`)
        .join("");

      const heads=days.map(d=>{
        const key=localKey(d);
        return `<div class="timeline-day-head ${key===todayKey?"today":""}">
          <div class="day-name">${escapeHtml(dayName.format(d))}</div>
          <div class="day-number">${d.getDate()}</div>
        </div>`;
      }).join("");

      const columns=days.map(d=>{
        const key=localKey(d);
        const list=map[key]||[];

        const cards=list.map(a=>{
          const startDate=new Date(a.starts_at);
          const endDate=new Date(a.ends_at);
          const startMinutes=minutesInBrussels(startDate);
          const durationMinutes=Math.max(15,Math.round((endDate-startDate)/60000));
          const visibleStart=Math.max(startMinutes,startHour*60);
          const visibleEnd=Math.min(startMinutes+durationMinutes,endHour*60);

          if(visibleEnd<=startHour*60 || visibleStart>=endHour*60) return "";

          const top=(visibleStart-startHour*60)*pixelsPerMinute;
          const height=Math.max(18,(visibleEnd-visibleStart)*pixelsPerMinute);
          const client=a.clients ? `${a.clients.first_name} ${a.clients.last_name}` : "Cliente";
          const sizeClass=height<35?"tiny":height<65?"compact":"";

          return `<div class="timeline-appointment ${escapeHtml(a.status)} ${sizeClass}"
                       data-id="${a.id}"
                       style="top:${top}px;height:${height}px"
                       title="${escapeHtml(client)} — ${escapeHtml(a.service_name_snapshot)}">
            <div class="appointment-time">${timeFormat.format(startDate)} – ${timeFormat.format(endDate)}</div>
            <div class="appointment-client">${escapeHtml(client)}</div>
            <div class="appointment-service">${escapeHtml(a.service_name_snapshot)}</div>
            <div class="appointment-price">${euro.format((a.expected_price_cents||0)/100)}</div>
          </div>`;
        }).join("");

        let nowLine="";
        if(key===todayKey){
          const nowMinutes=minutesInBrussels(new Date());
          if(nowMinutes>=startHour*60 && nowMinutes<=endHour*60){
            nowLine=`<div class="current-time-line" style="top:${(nowMinutes-startHour*60)*pixelsPerMinute}px"></div>`;
          }
        }

        return `<div class="timeline-day ${key===todayKey?"today":""}" style="height:${totalHeight}px">
          ${cards}${nowLine}
        </div>`;
      }).join("");

      document.getElementById("calendar").innerHTML=`
        <div class="timeline-week">
          <div class="timeline-head">
            <div class="timeline-head-spacer"></div>
            ${heads}
          </div>
          <div class="timeline-body">
            <div class="time-axis" style="height:${totalHeight}px">${hourLabels}</div>
            ${columns}
          </div>
        </div>`;
    }

    function brusselsLocalToDate(dateKey,timeValue){
      /*
        Construit l'instant UTC correspondant à une date/heure de Bruxelles.
        On part d'une estimation puis on corrige avec l'écart observé.
      */
      const [year,month,day]=dateKey.split("-").map(Number);
      const [hour,minute]=timeValue.split(":").map(Number);
      let guess=new Date(Date.UTC(year,month-1,day,hour,minute));

      const parts=new Intl.DateTimeFormat("en-CA",{
        timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",
        hour:"2-digit",minute:"2-digit",hourCycle:"h23"
      }).formatToParts(guess);
      const v={};
      parts.forEach(p=>{if(p.type!=="literal")v[p.type]=p.value;});

      const shownAsUTC=Date.UTC(
        Number(v.year),Number(v.month)-1,Number(v.day),
        Number(v.hour),Number(v.minute)
      );
      const wantedAsUTC=Date.UTC(year,month-1,day,hour,minute);
      guess=new Date(guess.getTime()+(wantedAsUTC-shownAsUTC));

      return guess;
    }

      if(!lightbox||!image)return;
      lightbox.classList.remove("open");
      lightbox.setAttribute("aria-hidden","true");
      image.removeAttribute("src");
    }

    async function loadAppointmentInspirations(appointmentId){
      const target=document.getElementById("prep-media");
      if(!target)return;
      const {data:media,error}=await supabaseClient.from("appointment_media")
        .select("id,storage_path,caption,display_order,created_at")
        .eq("appointment_id",appointmentId).eq("media_type","inspiration")
        .order("display_order",{ascending:true}).order("created_at",{ascending:true});
      if(error){console.error(error);target.textContent="Impossible de charger les inspirations.";return;}
      if(!media?.length){target.textContent="Aucune photo d’inspiration.";return;}

      const cards=[];
      for(const item of media){
        const {data:signed,error:signedError}=await supabaseClient.storage
          .from("appointment-media").createSignedUrl(item.storage_path,3600);
        if(signedError||!signed?.signedUrl){console.error(signedError);continue;}
        cards.push(`<button class="prep-media-card" type="button" data-inspiration-url="${escapeHtml(signed.signedUrl)}" title="Agrandir l’inspiration"><img src="${escapeHtml(signed.signedUrl)}" alt="Inspiration nail art" loading="lazy"></button>`);
      }
      if(!cards.length){target.textContent="Les inspirations existent, mais leur aperçu n’a pas pu être chargé.";return;}
      target.className="prep-media-grid";
      target.innerHTML=cards.join("");
      target.querySelectorAll("[data-inspiration-url]").forEach(card=>{
        card.addEventListener("click",()=>openInspirationLightbox(card.dataset.inspirationUrl));
      });
    }

      let selectedTemplate="almond";


      function setStatus(message,clear=true){status.textContent=message||"";if(clear&&message)setTimeout(()=>{if(status.textContent===message)status.textContent=""},2500)}
      function snapshot(){undo.push(canvas.toDataURL("image/png"));if(undo.length>20)undo.shift();redo=[]}
      function restoreDataUrl(url){return new Promise(resolve=>{const img=new Image();img.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve()};img.src=url})}
      function blank(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#f7f3ec";ctx.fillRect(0,0,canvas.width,canvas.height)}
      function closePalettes(){document.querySelectorAll(".sketch-palette").forEach(p=>p.classList.remove("open"))}
      function setTool(next,paletteId=""){
        tool=next;document.querySelectorAll(".sketch-tool").forEach(b=>b.classList.remove("active"));closePalettes();
        const map={draw:"sketch-draw",chrome:"sketch-chrome",rhinestone:"sketch-rhinestone",decoration:"sketch-deco",eraser:"sketch-eraser"};
        if(map[next])document.getElementById(map[next])?.classList.add("active");
        if(paletteId)document.getElementById(paletteId)?.classList.add("open");
      }
      function activateChoice(selector,button){document.querySelectorAll(selector).forEach(b=>b.classList.remove("active"));button.classList.add("active")}
      function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}

      function chromeGradient(a,b,w){
        const palettes={
          silver:["#5f6264","#d9dcdd","#ffffff","#aeb4b7","#f8f9f9","#6f7375"],
          gold:["#6d4a12","#c89428","#fff1a1","#fffdf1","#d5a83b","#765217"],
          champagne:["#8b7152","#d6b98d","#fff2d6","#fffdf6","#c9aa82","#8d7355"],
          rose:["#85584f","#d99e91","#ffe0d7","#fff8f4","#c8897c","#8e5d54"],
          aurora:["#9ecfe4","#e6c9ff","#fff7d4","#ffffff","#bcebdc","#d2c3ff"],
          color:[color.value,"#d9d9d9","#ffffff",color.value,"#f5e9ff",color.value]
        };
        const arr=palettes[chromeType]||palettes.silver;
        const dx=b.x-a.x,dy=b.y-a.y,len=Math.max(1,Math.hypot(dx,dy));
        const nx=-dy/len,ny=dx/len;
        const g=ctx.createLinearGradient(a.x-nx*w,a.y-ny*w,a.x+nx*w,a.y+ny*w);
        arr.forEach((c,i)=>g.addColorStop(i/(arr.length-1),c));
        return g;
      }

      function drawLine(a,b){
        const w=Number(size.value)*2.2;ctx.save();ctx.lineCap="round";ctx.lineJoin="round";ctx.lineWidth=w;
        if(tool==="eraser"){
          ctx.globalCompositeOperation="destination-out";ctx.strokeStyle="#000";
          ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
        }else if(tool==="chrome"){
          ctx.strokeStyle=chromeGradient(a,b,w);
          ctx.shadowColor="rgba(255,255,255,.35)";ctx.shadowBlur=w*.12;
          ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
          // Reflet fin continu : donne un rendu chrome/perlé sans effet "ressort".
          ctx.shadowBlur=0;ctx.globalAlpha=.72;ctx.lineWidth=Math.max(1.5,w*.16);
          ctx.strokeStyle="rgba(255,255,255,.95)";
          ctx.beginPath();ctx.moveTo(a.x-w*.10,a.y-w*.10);ctx.lineTo(b.x-w*.10,b.y-w*.10);ctx.stroke();
        }else{
          ctx.strokeStyle=color.value;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
        }
        ctx.restore();
      }

      function gemColors(){
        return {
          crystal:["#ffffff","#dce7e9","#8f9da0","#5f6769"],
          ab:["#ffffff","#f0caff","#a9e8ed","#ffe4a8"],
          pearl:["#fffdf7","#eee5db","#cdbfb1","#9e9186"],
          gold:["#fff1a8","#d6a43a","#8a611a","#fff8d0"],
          silver:["#ffffff","#d7dcde","#858d91","#f8f8f7"],
          color:["#ffffff",color.value,"#7f6b8f",color.value]
        }[gemType]||["#fff","#dce7e9","#8f9da0","#5f6769"];
      }
      function gemPath(r,shape){
        ctx.beginPath();
        // Une perle reste volontairement parfaitement ronde.
        if(gemType==="pearl"){ctx.arc(0,0,r,0,Math.PI*2);ctx.closePath();return}
        if(shape==="square"){
          ctx.moveTo(-r*.68,-r*.82);ctx.lineTo(r*.68,-r*.82);ctx.lineTo(r*.82,-r*.68);
          ctx.lineTo(r*.82,r*.68);ctx.lineTo(r*.68,r*.82);ctx.lineTo(-r*.68,r*.82);
          ctx.lineTo(-r*.82,r*.68);ctx.lineTo(-r*.82,-r*.68);
        }else if(shape==="drop"){
          ctx.moveTo(0,-r*1.12);ctx.lineTo(r*.60,-r*.35);ctx.lineTo(r*.72,r*.28);
          ctx.lineTo(r*.38,r*.82);ctx.lineTo(0,r);ctx.lineTo(-r*.38,r*.82);
          ctx.lineTo(-r*.72,r*.28);ctx.lineTo(-r*.60,-r*.35);
        }else if(shape==="marquise"){
          ctx.moveTo(0,-r*1.18);ctx.lineTo(r*.52,-r*.55);ctx.lineTo(r*.68,0);
          ctx.lineTo(r*.52,r*.55);ctx.lineTo(0,r*1.18);ctx.lineTo(-r*.52,r*.55);
          ctx.lineTo(-r*.68,0);ctx.lineTo(-r*.52,-r*.55);
        }else{
          // Rond taillé : contour octogonal plutôt qu'une bille parfaitement ronde.
          for(let i=0;i<8;i++){
            const ang=-Math.PI/2+i*Math.PI/4,x=Math.cos(ang)*r,y=Math.sin(ang)*r;
            i?ctx.lineTo(x,y):ctx.moveTo(x,y);
          }
        }
        ctx.closePath();
      }

      function drawRhinestone(p){
        const r=Math.max(9,Number(size.value)*1.7),cs=gemColors();
        ctx.save();ctx.translate(p.x,p.y);

        // Ombre très légère, juste pour détacher le strass du croquis.
        ctx.shadowColor="rgba(41,40,36,.18)";ctx.shadowBlur=r*.24;ctx.shadowOffsetY=r*.08;

        const g=ctx.createRadialGradient(-r*.35,-r*.38,r*.04,0,0,r*1.08);
        g.addColorStop(0,"#ffffff");
        g.addColorStop(.14,cs[0]);
        g.addColorStop(.38,cs[1]);
        g.addColorStop(.70,cs[2]);
        g.addColorStop(1,cs[3]);
        ctx.fillStyle=g;ctx.strokeStyle="rgba(70,66,62,.48)";ctx.lineWidth=Math.max(1.2,r*.08);
        gemPath(r,gemShape);ctx.fill();ctx.stroke();

        // Facettes internes : on garde la forme du strass mais on casse l'effet "bille".
        ctx.shadowColor="transparent";ctx.save();gemPath(r*.90,gemShape);ctx.clip();
        ctx.globalAlpha=.42;ctx.lineWidth=Math.max(1,r*.055);
        ctx.strokeStyle="#ffffff";
        for(let i=0;i<6;i++){
          const ang=i*Math.PI/3;
          ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(ang)*r*.92,Math.sin(ang)*r*.92);ctx.stroke();
        }
        ctx.globalAlpha=.22;ctx.fillStyle="#ffffff";
        ctx.beginPath();ctx.moveTo(-r*.72,-r*.12);ctx.lineTo(-r*.18,-r*.78);ctx.lineTo(r*.18,-r*.18);ctx.closePath();ctx.fill();
        ctx.restore();

        // Éclat principal + mini éclat secondaire.
        ctx.globalAlpha=1;ctx.fillStyle="#ffffff";
        ctx.beginPath();ctx.arc(-r*.34,-r*.38,Math.max(2.2,r*.16),0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(r*.28,-r*.18,Math.max(1.2,r*.07),0,Math.PI*2);ctx.fill();

        // Éclat plus net pour Cristal / AB. La perle reste douce et ronde.
        if(gemType==="crystal" || gemType==="ab"){
          ctx.translate(-r*.48,-r*.48);ctx.strokeStyle="rgba(255,255,255,.98)";ctx.lineWidth=Math.max(1.2,r*.065);
          ctx.beginPath();ctx.moveTo(-r*.28,0);ctx.lineTo(r*.28,0);ctx.moveTo(0,-r*.28);ctx.lineTo(0,r*.28);ctx.stroke();
          ctx.rotate(Math.PI/4);ctx.globalAlpha=.72;
          ctx.beginPath();ctx.moveTo(-r*.14,0);ctx.lineTo(r*.14,0);ctx.moveTo(0,-r*.14);ctx.lineTo(0,r*.14);ctx.stroke();
        }
        ctx.restore();
      }

      function drawDecoration(p,type){
        const r=Math.max(10,Number(size.value)*2);ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle=color.value;ctx.strokeStyle=color.value;ctx.lineWidth=Math.max(3,r*.14);
        if(type==="star"||type==="sparkle"){
          const points=type==="star"?5:4,outer=r,inner=type==="star"?r*.42:r*.16;ctx.beginPath();
          for(let i=0;i<points*2;i++){const rr=i%2===0?outer:inner,ang=-Math.PI/2+i*Math.PI/points,x=Math.cos(ang)*rr,y=Math.sin(ang)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
          ctx.closePath();ctx.fill();
        }else if(type==="heart"){
          ctx.beginPath();ctx.moveTo(0,r*.75);ctx.bezierCurveTo(-r*1.2,-r*.05,-r*.75,-r*.9,0,-r*.35);ctx.bezierCurveTo(r*.75,-r*.9,r*1.2,-r*.05,0,r*.75);ctx.fill();
        }else if(type==="flower"){
          for(let i=0;i<5;i++){ctx.save();ctx.rotate(i*Math.PI*2/5);ctx.beginPath();ctx.ellipse(0,-r*.55,r*.28,r*.55,0,0,Math.PI*2);ctx.fill();ctx.restore()}
          ctx.fillStyle="#fffdf9";ctx.beginPath();ctx.arc(0,0,r*.22,0,Math.PI*2);ctx.fill();
        }else if(type==="bow"){
          ctx.beginPath();ctx.ellipse(-r*.48,0,r*.52,r*.32,-.25,0,Math.PI*2);ctx.ellipse(r*.48,0,r*.52,r*.32,.25,0,Math.PI*2);ctx.fill();
          ctx.beginPath();ctx.arc(0,0,r*.22,0,Math.PI*2);ctx.fill();
        }else if(type==="cross"){
          ctx.beginPath();ctx.moveTo(-r,0);ctx.lineTo(r,0);ctx.moveTo(0,-r);ctx.lineTo(0,r);ctx.stroke();
        }else{ctx.beginPath();ctx.arc(0,0,r*.45,0,Math.PI*2);ctx.fill()}
        ctx.restore();
      }

      function drawBackgroundImage(img){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle="#ffffff";ctx.fillRect(0,0,canvas.width,canvas.height);

        // Les templates "ongles seuls" peuvent remplir davantage le canvas.
        // La vue mains reste légèrement plus aérée pour ne rien couper.
        const padding = selectedTemplate==="hands" ? 54 : 16;
        const availableW=canvas.width-padding*2, availableH=canvas.height-padding*2;
        let scale=Math.min(availableW/img.width,availableH/img.height);
        // Les planches Amande/Carré ont beaucoup de blanc dans l'image source :
        // on les zoome pour que les ongles occupent réellement la zone de travail.
        if(selectedTemplate==="almond") scale*=1.45;
        if(selectedTemplate==="square") scale*=1.72;
        const w=img.width*scale,h=img.height*scale;
        ctx.drawImage(img,(canvas.width-w)/2,(canvas.height-h)/2,w,h);
        baseImage=img;
      }
      function setTemplateButton(name){
        ["almond","square","hands","photo"].forEach(n=>{
          document.getElementById(`sketch-template-${n}`)?.classList.toggle("active",n===name);
        });
        selectedTemplate=name;
      }
      function loadBuiltInTemplate(name,remember=true){
        const url=builtInTemplates[name]; if(!url)return;
        const img=new Image();
        img.onload=()=>{
          if(remember)snapshot();
          setTemplateButton(name);
          drawBackgroundImage(img);
          if(remember)setStatus("Template chargé ✓");
        };
        img.src=url;
      }

      blank();

      const {data:existing,error:existingError}=await supabaseClient.from("appointment_media").select("id,storage_path,created_at")
        .eq("appointment_id",appointmentId).eq("media_type","sketch").order("created_at",{ascending:false}).limit(1).maybeSingle();
      if(existingError)console.error(existingError);
      if(existing?.storage_path){
        const {data:signed}=await supabaseClient.storage.from("appointment-media").createSignedUrl(existing.storage_path,3600);
        if(signed?.signedUrl){
          const img=new Image();
          img.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);baseImage=null;setTemplateButton("photo")};
          img.src=signed.signedUrl;
        }
      }else{
        loadBuiltInTemplate("almond",false);
      }

      canvas.addEventListener("pointerdown",e=>{
        e.preventDefault();canvas.setPointerCapture?.(e.pointerId);const p=point(e);snapshot();
        if(tool==="rhinestone"){drawRhinestone(p);return}
        if(tool==="decoration"){drawDecoration(p,decoType);return}
        drawing=true;last=p;drawLine(p,{x:p.x+.1,y:p.y+.1});
      });
      canvas.addEventListener("pointermove",e=>{if(!drawing)return;const p=point(e);drawLine(last,p);last=p});
      const endDraw=()=>{drawing=false;last=null};canvas.addEventListener("pointerup",endDraw);canvas.addEventListener("pointercancel",endDraw);canvas.addEventListener("pointerleave",endDraw);

      document.getElementById("sketch-draw").onclick=()=>setTool("draw");
      document.getElementById("sketch-chrome").onclick=()=>setTool("chrome","chrome-palette");
      document.getElementById("sketch-rhinestone").onclick=()=>setTool("rhinestone","rhinestone-palette");
      document.getElementById("sketch-deco").onclick=()=>setTool("decoration","deco-palette");
      document.getElementById("sketch-eraser").onclick=()=>setTool("eraser");

      document.querySelectorAll("[data-chrome]").forEach(b=>b.onclick=()=>{chromeType=b.dataset.chrome;activateChoice("[data-chrome]",b)});
      document.querySelectorAll("[data-gem]").forEach(b=>b.onclick=()=>{gemType=b.dataset.gem;activateChoice("[data-gem]",b)});
      document.querySelectorAll("[data-gem-shape]").forEach(b=>b.onclick=()=>{gemShape=b.dataset.gemShape;activateChoice("[data-gem-shape]",b)});
      document.querySelectorAll("[data-deco]").forEach(b=>b.onclick=()=>{decoType=b.dataset.deco;activateChoice("[data-deco]",b)});

      document.getElementById("sketch-template-almond").onclick=()=>loadBuiltInTemplate("almond");
      document.getElementById("sketch-template-square").onclick=()=>loadBuiltInTemplate("square");
      document.getElementById("sketch-template-hands").onclick=()=>loadBuiltInTemplate("hands");
      document.getElementById("sketch-template-photo").onclick=()=>fileInput.click();

      document.getElementById("sketch-background").onclick=()=>fileInput.click();
      fileInput.onchange=()=>{
        const file=fileInput.files?.[0];if(!file)return;
        if(file.size>5*1024*1024){setStatus("Image trop lourde (5 Mo max).",false);return}
        const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{
          snapshot();drawBackgroundImage(img);setTemplateButton("photo");setStatus("Fond ajouté ✓");
        };img.src=reader.result};reader.readAsDataURL(file);fileInput.value="";
      };

      document.getElementById("sketch-undo").onclick=async()=>{if(!undo.length)return;redo.push(canvas.toDataURL("image/png"));await restoreDataUrl(undo.pop())};
      document.getElementById("sketch-redo").onclick=async()=>{if(!redo.length)return;undo.push(canvas.toDataURL("image/png"));await restoreDataUrl(redo.pop())};
      document.getElementById("sketch-clear").onclick=()=>{
        snapshot();
        if(baseImage){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#f7f3ec";ctx.fillRect(0,0,canvas.width,canvas.height);
          const scale=Math.min(canvas.width/baseImage.width,canvas.height/baseImage.height),w=baseImage.width*scale,h=baseImage.height*scale;
          ctx.drawImage(baseImage,(canvas.width-w)/2,(canvas.height-h)/2,w,h)}
        else blank();
      };

      document.getElementById("sketch-save").onclick=async()=>{
        const button=document.getElementById("sketch-save");button.disabled=true;setStatus("Enregistrement…",false);
        try{
          const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/png",.95));if(!blob)throw new Error("Impossible de créer l’image.");
          const path=`${appointmentId}/sketch/${crypto.randomUUID()}.png`;
          const {error:uploadError}=await supabaseClient.storage.from("appointment-media").upload(path,blob,{contentType:"image/png",upsert:false});if(uploadError)throw uploadError;
          const {data:oldRows,error:oldError}=await supabaseClient.from("appointment_media").select("id,storage_path").eq("appointment_id",appointmentId).eq("media_type","sketch");if(oldError)throw oldError;
          const {error:insertError}=await supabaseClient.from("appointment_media").insert({appointment_id:appointmentId,media_type:"sketch",storage_path:path,caption:"Croquis de préparation",display_order:0,uploaded_by:"admin"});
          if(insertError){await supabaseClient.storage.from("appointment-media").remove([path]);throw insertError}
          const previous=(oldRows||[]).filter(x=>x.storage_path!==path);
          if(previous.length){await supabaseClient.from("appointment_media").delete().in("id",previous.map(x=>x.id));await supabaseClient.storage.from("appointment-media").remove(previous.map(x=>x.storage_path))}
          setStatus("Croquis enregistré ✓");
        }catch(error){console.error(error);setStatus("Impossible d’enregistrer le croquis.",false)}
        finally{button.disabled=false}
      };
    }

    async function saveAppointmentEdit(a){
      const button=document.getElementById("save-edit");
      const message=document.getElementById("edit-message");
      const dateValue=document.getElementById("edit-date").value;
      const timeValue=document.getElementById("edit-time").value;
      const duration=Number(document.getElementById("edit-duration").value);
      const priceEuros=Number(document.getElementById("edit-price").value.replace(",","."));

      if(!dateValue || !timeValue || !Number.isFinite(duration) || duration<15 || !Number.isFinite(priceEuros) || priceEuros<0){
        message.textContent="Vérifie la date, l’heure, la durée et le montant.";
        message.className="form-message error-message";
        return;
      }

      const startsAt=brusselsLocalToDate(dateValue,timeValue);
      const endsAt=new Date(startsAt.getTime()+duration*60000);

      /* Empêche de déplacer le RDV sur un autre RDV actif. */
      const {data:conflicts,error:conflictError}=await supabaseClient
        .from("appointments")
        .select("id")
        .neq("id",a.id)
        .in("status",["pending","confirmed"])
        .lt("starts_at",endsAt.toISOString())
        .gt("ends_at",startsAt.toISOString())
        .limit(1);

      if(conflictError){
        console.error(conflictError);
        message.textContent="Impossible de vérifier le créneau.";
        message.className="form-message error-message";
        return;
      }
      if(conflicts?.length){
        message.textContent="Ce créneau chevauche déjà un autre rendez-vous.";
        message.className="form-message error-message";
        return;
      }

      button.disabled=true;
      message.textContent="Enregistrement…";
      message.className="form-message";

      const {error}=await supabaseClient.from("appointments").update({
        starts_at:startsAt.toISOString(),
        ends_at:endsAt.toISOString(),
        expected_price_cents:Math.round(priceEuros*100)
      }).eq("id",a.id);

      if(error){
        console.error(error);
        button.disabled=false;
        message.textContent="La modification n’a pas pu être enregistrée.";
        message.className="form-message error-message";
        return;
      }

      closeModal();
      await loadAppointments();
    }

    async function completeAppointment(a){
      const button=document.getElementById("confirm-complete");

      const amount=Number(document.getElementById("paid-amount").value.replace(",","."));
      const method=document.getElementById("payment-method").value;

        message.textContent="Entre un montant valide.";

        return;

      button.disabled=true;
      message.textContent="Enregistrement…";
      message.className="form-message";

      const {data,error}=await supabaseClient.rpc("admin_complete_appointment",{
        p_appointment_id:a.id,
        p_amount_cents:Math.round(amount*100),
        p_payment_method:method

        button.disabled=false;

        button.disabled=false;
        message.textContent="Le rendez-vous n’a pas pu être terminé.";
        message.className="form-message error-message";
        return;
      }

      closeModal();
      await loadAppointments();
    }

          <h3 class="form-title">Rétablir le rendez-vous</h3>
          <div class="form-message">Le rendez-vous repassera en « Confirmé ». Aucun paiement ne sera recréé automatiquement : tu pourras ensuite le terminer avec le vrai montant encaissé.</div>
          <button id="confirm-restore" class="action-button primary" type="button">Rétablir</button>
        </div>`;
      document.getElementById("confirm-restore").addEventListener("click",()=>restoreAppointment(a));
    }

    async function restoreAppointment(a){
      const button=document.getElementById("confirm-restore");
      const box=button.closest(".form-box");
      const message=box.querySelector(".form-message");
      button.disabled=true;
      message.textContent="Rétablissement…";
      const {error}=await supabaseClient.rpc("admin_correct_appointment_finances",{
        p_appointment_id:a.id,
        p_action:"restore",
        p_amount_cents:null,
        p_payment_method:null
      });
      if(error){
        console.error(error);
        button.disabled=false;
        message.textContent="Le rendez-vous n’a pas pu être rétabli.";
        message.className="form-message error-message";
        return;
      }
      closeModal();
      await loadAppointments();
    }

    function showCancelForm(a){
      const area=document.getElementById("appointment-action-area");
      area.innerHTML=`
        <div class="form-box">
          <h3 class="form-title">Annuler le rendez-vous</h3>
          <div class="form-field">
            <label>Raison / note interne (facultatif)</label>
            <input id="cancel-reason" type="text" placeholder="Ex. cliente malade, changement de planning…">
          </div>
          <div id="cancel-message" class="form-message">Le rendez-vous restera dans Supabase avec le statut « annulé ».</div>
          <button id="confirm-cancel" class="action-button danger" type="button">Confirmer l’annulation</button>
        </div>`;
      document.getElementById("confirm-cancel").addEventListener("click",()=>cancelAppointment(a));
    }

    async function cancelAppointment(a){
      const button=document.getElementById("confirm-cancel");
      const message=document.getElementById("cancel-message");
      const reason=document.getElementById("cancel-reason").value.trim();

      button.disabled=true;
      message.textContent="Annulation…";
      message.className="form-message";

      const update={status:"cancelled_by_admin"};
      if(reason) update.cancellation_reason=reason;

      const {error}=await supabaseClient.from("appointments").update(update).eq("id",a.id);

      if(error){
        console.error(error);
        button.disabled=false;
        message.textContent="L’annulation n’a pas pu être enregistrée.";
        message.className="form-message error-message";
        return;
      }

      closeModal();
      await loadAppointments();
    }

    document.getElementById("close-modal").addEventListener("click",closeModal);
    document.getElementById("modal-backdrop").addEventListener("click",e=>{if(e.target.id==="modal-backdrop")closeModal()});
    document.getElementById("week-view").addEventListener("click",()=>{currentView="week";localStorage.setItem("adminAgendaView","week");loadAppointments()});
    document.getElementById("month-view").addEventListener("click",()=>{currentView="month";localStorage.setItem("adminAgendaView","month");loadAppointments()});
    document.getElementById("today").addEventListener("click",()=>{currentDate=new Date();loadAppointments()});
    document.getElementById("previous").addEventListener("click",()=>{currentDate=currentView==="week"?addDays(currentDate,-7):new Date(currentDate.getFullYear(),currentDate.getMonth()-1,1,12);loadAppointments()});
    document.getElementById("next").addEventListener("click",()=>{currentDate=currentView==="week"?addDays(currentDate,7):new Date(currentDate.getFullYear(),currentDate.getMonth()+1,1,12);loadAppointments()});
    document.getElementById("logout").addEventListener("click",async()=>{await supabaseClient.auth.signOut();window.location.replace("./")});

    async function init(){
      if(!await protectPage()) return;
      await loadAppointments();
    }
    init();
  
    document.getElementById("prep-media-lightbox-close")?.addEventListener("click",closeInspirationLightbox);
    document.getElementById("prep-media-lightbox")?.addEventListener("click",e=>{
      if(e.target.id==="prep-media-lightbox") closeInspirationLightbox();
    });
    document.addEventListener("keydown",e=>{
      if(e.key==="Escape") closeInspirationLightbox();
    });

</script>
</body>
</html>
