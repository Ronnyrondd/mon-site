<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Ton croquis — Thab's Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--cream:#FAF7F0;--ink:#2B241F;--soft:#5B5148;--sage:#748058;--sage2:#56622F;--pale:#DEE4CB;--aub:#4a2441;--aubbg:#e9dce6;--card:#FFFEFC;--line:rgba(43,36,31,.14);--shadow:0 18px 45px -28px rgba(43,36,31,.4)}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Jost,sans-serif;-webkit-text-size-adjust:100%}
.wrap{width:min(720px,calc(100% - 32px));margin:auto;padding:28px 0 48px}
.brand{font-family:Fraunces,serif;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage2);text-align:center;margin-bottom:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:clamp(18px,4vw,32px);box-shadow:var(--shadow)}
h1{font-family:Fraunces,serif;font-weight:500;font-size:clamp(24px,5vw,31px);margin:0 0 6px}
.sub{color:var(--soft);margin:0 0 18px;line-height:1.5}
.pic{display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--line);background:#fff}
.hint{font-size:13px;color:var(--soft);margin:8px 2px 0;text-align:center}
.actions{display:grid;gap:10px;margin-top:22px}
button{font:inherit;font-weight:500;border-radius:16px;min-height:52px;padding:0 20px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
button.ok{background:var(--sage2);color:#fff;border-color:var(--sage2)}
button:disabled{opacity:.6}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;resize:vertical;background:#fff;margin-top:12px}
.box{margin-top:18px;padding:14px 16px;border-radius:14px;background:var(--pale);color:var(--sage2);line-height:1.5}
.box.mauve{background:var(--aubbg);color:var(--aub)}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Thab's Lab</div>
  <div class="panel" id="panel"><p class="sub">Chargement…</p></div>
</div>
<script>
const db=supabase.createClient("https://zlmwytycgopowalfrjwf.supabase.co","sb_publishable_oN_GBtiyokchMsnKNLu-1A_Cz_dtDrG");
const token=new URLSearchParams(location.search).get("t")||"";
const P=document.getElementById("panel");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=new Intl.DateTimeFormat("fr-BE",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit",timeZone:"Europe/Brussels"});
let sk=null;

function view(){
  const when=sk.starts_at?fmt.format(new Date(sk.starts_at)):"";
  const hello=sk.first_name?`Coucou ${esc(sk.first_name)} 🌿`:"Coucou 🌿";
  let status="";
  if(sk.status==="approved")status=`<div class="box">Merci, c'est noté : tu as validé ce croquis ✓</div>`;
  if(sk.status==="changes_requested")status=`<div class="box mauve">Merci, j'ai bien reçu ta demande de modifications${sk.comment?` :<br><em>« ${esc(sk.comment)} »</em>`:""}. Je reviens vers toi très vite !</div>`;
  const answered=sk.status==="approved"||sk.status==="changes_requested";
  P.innerHTML=`<h1>${hello}</h1>
  <p class="sub">Voici le croquis de ton prochain rendez-vous${when?` (<strong>${esc(when)}</strong>${sk.service?`, ${esc(sk.service)}`:""})`:""}. Dis-moi si ça te plaît !</p>
  ${sk.preview?`<img class="pic" src="${esc(sk.preview)}" alt="Croquis de tes ongles">`:""}
  <p class="hint">Rendu indicatif : le résultat final peut légèrement varier selon la couleur exacte du vernis.</p>
  ${status}
  <div class="actions" id="actions">
    ${answered?`<button type="button" id="again">Modifier ma réponse</button>`:`<button type="button" class="ok" id="yes">J'adore, je valide ✓</button><button type="button" id="chg">Je souhaite des changements</button>`}
  </div>
  <div id="form" class="hidden"><textarea id="cm" maxlength="1000" placeholder="Dis-moi ce que tu aimerais changer (couleur, forme, motif…)">${esc(sk.comment||"")}</textarea>
  <div class="actions"><button type="button" class="ok" id="send">Envoyer</button></div></div>`;
  const send=async(st,cm)=>{
    document.querySelectorAll("button").forEach(b=>b.disabled=true);
    const{data,error}=await db.rpc("respond_to_sketch",{p_token:token,p_status:st,p_comment:cm||null});
    if(error||data!==true){alert("Oups, ça n'a pas fonctionné. Réessaie dans un instant 💛");document.querySelectorAll("button").forEach(b=>b.disabled=false);return}
    sk.status=st;sk.comment=cm||null;view();window.scrollTo({top:0,behavior:"smooth"});
  };
  const yes=document.getElementById("yes");if(yes)yes.onclick=()=>send("approved","");
  const showForm=()=>{document.getElementById("form").classList.remove("hidden");document.getElementById("actions").classList.add("hidden");document.getElementById("cm").focus()};
  const chg=document.getElementById("chg");if(chg)chg.onclick=showForm;
  const again=document.getElementById("again");if(again)again.onclick=showForm;
  document.getElementById("send").onclick=()=>{const c=document.getElementById("cm").value.trim();if(!c){document.getElementById("cm").focus();return}send("changes_requested",c)};
}
(async()=>{
  if(!/^[0-9a-f-]{36}$/i.test(token)){P.innerHTML=`<h1>Lien introuvable</h1><p class="sub">Ce lien ne semble pas complet. Peux-tu me demander de te le renvoyer ?</p>`;return}
  const{data,error}=await db.rpc("get_sketch_for_client",{p_token:token});
  if(error||!data){P.innerHTML=`<h1>Croquis introuvable</h1><p class="sub">Ce lien n'est plus valable ou le croquis n'est pas encore prêt. Écris-moi et je te le renvoie 🌿</p>`;return}
  sk=data;view();
})();
</script>
</body>
</html>
